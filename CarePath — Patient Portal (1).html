<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarePath — Patient Portal</title>
<style>
:root{
  --teal:#0F5C56;--teal-d:#0A423E;--mint:#F2F8F6;--ink:#152420;--ink-soft:#4B5D58;
  --line:#DCE7E4;--amber:#C67C2E;--red:#C0392B;--green:#2E8B57;--white:#fff;
  --radius:10px;--shadow:0 1px 2px rgba(10,66,62,.06),0 4px 14px rgba(10,66,62,.06);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--mint);color:var(--ink);overflow-x:hidden}
h1,h2,h3,h4{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;margin:0 0 4px;color:var(--teal-d)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
/* SIDEBAR */
.sidebar{width:230px;background:var(--teal-d);color:#DDEEEA;flex-shrink:0;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;padding:20px 0;z-index:50;transition:transform .25s}
.brand{padding:0 20px 18px;font-family:Georgia,serif;font-size:20px;color:#fff;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.brand span{color:#7FD9C9}
.navlist{list-style:none;margin:0;padding:0;flex:1;overflow-y:auto}
.navlist li a{display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;color:#C9E3DD;border-left:3px solid transparent}
.navlist li a.active,.navlist li a:hover{background:rgba(255,255,255,.08);color:#fff;border-left-color:#7FD9C9}
.emg-side{margin:10px 16px 0;padding:10px;background:var(--red);border-radius:var(--radius);text-align:center;font-size:13px;font-weight:600;color:#fff}
.main{margin-left:230px;flex:1;min-width:0;padding:22px 28px 60px;max-width:1100px}
.topbar{display:none}
.hamb{display:none;background:none;border:none;font-size:22px;color:var(--teal-d)}
/* CARDS */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.pill.ok{background:#E4F5EC;color:var(--green)}
.pill.warn{background:#FBEEDD;color:var(--amber)}
.pill.bad{background:#FBE7E5;color:var(--red)}
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:#fff;border:1px solid var(--red);color:var(--red)}
.btn.emergency{background:var(--red);color:#fff;font-size:15px;padding:12px 20px;border-radius:10px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
label{font-size:12.5px;color:var(--ink-soft);display:block;margin:10px 0 4px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.section-title:first-child{margin-top:0}
.empty{text-align:center;padding:34px 10px;color:var(--ink-soft)}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.toast-wrap{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--teal-d);color:#fff;padding:11px 16px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);animation:slide .2s}
@keyframes slide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--mint);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:13px}
.stepper{display:flex;gap:8px;margin-bottom:18px}
.step{flex:1;height:5px;border-radius:3px;background:var(--line)}
.step.done{background:var(--teal)}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.muted{color:var(--ink-soft);font-size:13px}
.progress-track{display:flex;justify-content:space-between;margin:16px 0;position:relative}
.progress-track:before{content:'';position:absolute;top:11px;left:0;right:0;height:2px;background:var(--line);z-index:0}
.pnode{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--ink-soft);width:14%}
.pdot{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--line);margin-bottom:6px;display:flex;align-items:center;justify-content:center;font-size:11px}
.pdot.on{background:var(--teal);border-color:var(--teal);color:#fff}
.idcard{background:linear-gradient(135deg,var(--teal-d),var(--teal));color:#fff;border-radius:14px;padding:22px;max-width:380px}
.idcard .hname{text-align:center;font-family:Georgia,serif;font-size:18px;letter-spacing:.5px;border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:10px;margin-bottom:12px}
.idrow{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.25)}
.idrow b{font-weight:600}
@media(max-width:880px){
  .grid2,.grid3{grid-template-columns:1fr}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:16px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:sticky;top:0;background:var(--mint);padding-top:env(safe-area-inset-top,0px);z-index:40}
  .topbar .hamb{display:block}
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">Care<span>Path</span></div>
    <ul class="navlist" id="navlist"></ul>
    <a href="#emergency" class="emg-side">🚨 Emergency / Ambulance</a>
  </nav>
  <div class="main">
    <div class="topbar"><button class="hamb" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><b>CarePath</b><span></span></div>
    <div id="view"></div>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>
<div id="modal-root"></div>

<script>
/* ---------- DATA ---------- */
const uid=(p)=>p+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
const todayStr=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)};
const fmtDate=(s)=>new Date(s+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});

const DEFAULT_DB={
patient:{id:'PT-2026-0417',name:'Rahul Kumar',age:45,phone:'+91 98765 43210',email:'rahul.kumar@mail.com',
  emergencyContact:'Anita Kumar (Spouse) — +91 91234 56780',blood:'B+',conditions:'Hypertension'},
hospitals:[
 {id:'H1',name:'Apollo Speciality Hospital',address:'12 Anna Salai, Chennai',dist:1.2,phone:'044-2854 1000',
  emergency:true,rating:4.6,reviews:1820,hours:'24 Hours',beds:14,
  facilities:['Emergency Department','ICU','Pharmacy','Laboratory','Cardiology','Radiology','CT Scan'],
  departments:['Cardiology','General Medicine','Orthopedics'],
  doctors:[{id:'D1',name:'Dr. Arun Kumar',spec:'Cardiology'},{id:'D2',name:'Dr. Meera Shah',spec:'General Medicine'}]},
 {id:'H2',name:'City Care Hospital',address:'45 Mount Road, Chennai',dist:2.8,phone:'044-2233 4455',
  emergency:true,rating:4.2,reviews:940,hours:'24 Hours',beds:6,
  facilities:['Emergency Department','Pharmacy','Laboratory','X-Ray','Pediatrics','Gynecology'],
  departments:['Pediatrics','Gynecology','General Medicine'],
  doctors:[{id:'D3',name:'Dr. Priya Iyer',spec:'Pediatrics'},{id:'D4',name:'Dr. Suresh Nair',spec:'Gynecology'}]},
 {id:'H3',name:'Sunrise Multi-Speciality',address:'8 OMR Road, Chennai',dist:4.5,phone:'044-4009 8877',
  emergency:false,rating:4.4,reviews:610,hours:'7 AM – 10 PM',beds:0,
  facilities:['Pharmacy','Laboratory','MRI','Neurology','Orthopedics'],
  departments:['Neurology','Orthopedics'],
  doctors:[{id:'D5',name:'Dr. Kavitha Rao',spec:'Neurology'},{id:'D6',name:'Dr. Vikram Das',spec:'Orthopedics'}]},
 {id:'H4',name:'ABC General Hospital',address:'22 GST Road, Chennai',dist:6.7,phone:'044-5566 7788',
  emergency:true,rating:4.0,reviews:390,hours:'24 Hours',beds:9,
  facilities:['Emergency Department','ICU','Blood Bank','Operation Theatre','General Medicine'],
  departments:['General Medicine','Cardiology'],
  doctors:[{id:'D7',name:'Dr. Neha Bhat',spec:'General Medicine'}]},
 {id:'H5',name:'Wellspring Hospital',address:'3 ECR Road, Chennai',dist:9.2,phone:'044-1122 3344',
  emergency:false,rating:4.3,reviews:275,hours:'8 AM – 9 PM',beds:0,
  facilities:['Pharmacy','Laboratory','Radiology'],departments:['General Medicine'],
  doctors:[{id:'D8',name:'Dr. Sanjay Iyer',spec:'General Medicine'}]}
],
appointments:[
 {id:uid('APT'),hospitalId:'H1',doctorId:'D1',date:todayStr(3),time:'10:30 AM',dept:'Cardiology',reason:'Routine BP checkup',status:'Confirmed'},
],
records:[
 {id:uid('REC'),name:'Lipid Profile Report',type:'Blood Test',date:todayStr(-14),hospital:'Apollo Speciality Hospital',doctor:'Dr. Arun Kumar'},
 {id:uid('REC'),name:'Chest X-Ray',type:'X-Ray',date:todayStr(-40),hospital:'City Care Hospital',doctor:'Dr. Meera Shah'},
],
reminders:[
 {id:uid('REM'),title:'Take Blood Pressure Medicine',desc:'1 tablet after breakfast',type:'Medicine',date:todayStr(),time:'08:00 AM',freq:'Daily',active:true},
 {id:uid('REM'),title:'Blood Test — Lipid Panel',desc:'Fasting required, 12 hrs',type:'Test',date:todayStr(4),time:'09:00 AM',freq:'Once',active:true},
 {id:uid('REM'),title:'Doctor Follow-up',desc:'Post-checkup review',type:'Follow-up',date:todayStr(9),time:'04:30 PM',freq:'Once',active:true},
],
admissions:[],
ambulance:null
};
let DB=JSON.parse(JSON.stringify(DEFAULT_DB));
try{const saved=localStorage.getItem('carepath_db');if(saved)DB=JSON.parse(saved);}catch(e){}
function save(){try{localStorage.setItem('carepath_db',JSON.stringify(DB));}catch(e){}}

/* ---------- TOAST / MODAL ---------- */
function toast(msg){const w=document.getElementById('toasts');const t=document.createElement('div');t.className='toast';t.textContent=msg;w.appendChild(t);setTimeout(()=>t.remove(),3200);}
function modal(html){const r=document.getElementById('modal-root');r.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function confirmDialog(title,msg,okLabel,onOk){
  modal(`<h3>${title}</h3><p class="muted">${msg}</p><div class="row" style="justify-content:flex-end;margin-top:16px">
  <button class="btn ghost" onclick="closeModal()">Cancel</button>
  <button class="btn danger" id="cf-ok">${okLabel}</button></div>`);
  document.getElementById('cf-ok').onclick=()=>{onOk();closeModal();};
}

/* ---------- ROUTER ---------- */
const ROUTES=[['dashboard','🏠','Dashboard'],['hospitals','🏥','Find Hospitals'],['appointments','📅','Appointments'],
['records','📁','Medical Records'],['ai','🤖','AI Report Assistant'],['reminders','⏰','Health Reminders'],
['emergency','🚑','Ambulance / Emergency'],['admission','🪪','Patient Admission ID'],['profile','👤','Profile']];
function renderNav(hash){
  document.getElementById('navlist').innerHTML=ROUTES.map(([r,i,l])=>
   `<li><a href="#${r}" class="${hash===r?'active':''}">${i} ${l}</a></li>`).join('');
}
window.addEventListener('hashchange',route);
window.addEventListener('load',route);
function go(h){location.hash=h;}
function route(){
  let hash=(location.hash||'#dashboard').slice(1);
  let[page,param]=hash.split('/');
  document.getElementById('sidebar').classList.remove('open');
  renderNav(page);
  const v=document.getElementById('view');
  const pages={dashboard:pgDashboard,hospitals:pgHospitals,hospital:()=>pgHospitalDetail(param),
   book:()=>pgBook(param),appointments:pgAppointments,records:pgRecords,ai:pgAI,reminders:pgReminders,
   emergency:pgEmergency,admission:pgAdmission,profile:pgProfile};
  v.innerHTML=(pages[page]||pgDashboard)();
}

/* ---------- DASHBOARD ---------- */
function pgDashboard(){
  const p=DB.patient;
  const upcoming=DB.appointments.filter(a=>a.status!=='Cancelled').sort((a,b)=>a.date.localeCompare(b.date));
  const next=upcoming[0];
  const todays=DB.reminders.filter(r=>r.active).slice(0,3);
  return `
  <div class="section-title"><div><h1>Good morning, ${p.name.split(' ')[0]}</h1><div class="muted">Here's your health overview for today.</div></div>
  <button class="btn emergency" onclick="go('emergency')">🚨 Emergency</button></div>
  <div class="grid2">
    <div>
      <div class="card">
        <div class="row" style="align-items:center">
          <div class="avatar">${p.name.split(' ').map(n=>n[0]).join('')}</div>
          <div><h3 style="margin:0">${p.name}</h3><div class="muted">Patient ID: ${p.id} • Age ${p.age} • Blood ${p.blood}</div></div>
        </div>
        <div class="row" style="margin-top:14px;gap:24px">
          <div><label>Contact</label>${p.phone}</div>
          <div><label>Emergency Contact</label>${p.emergencyContact}</div>
          <div><label>Known Condition</label>${p.conditions}</div>
        </div>
      </div>
      <div class="section-title"><h3>Upcoming Appointments</h3><a class="btn ghost" href="#appointments">View all</a></div>
      ${next?apptCard(next):`<div class="card empty">No upcoming appointments<br><br><button class="btn primary" onclick="go('hospitals')">Book an Appointment</button></div>`}
      <div class="section-title"><h3>Today's Reminders</h3><a class="btn ghost" href="#reminders">Manage</a></div>
      <div class="card">${todays.length?todays.map(r=>`<div class="list-item"><div><b>${r.title}</b><div class="muted">${r.date===todayStr()?'Today':fmtDate(r.date)} • ${r.time} • ${r.freq}</div></div><span class="pill ok">Active</span></div>`).join(''):'<div class="empty">No reminders set.</div>'}</div>
    </div>
    <div>
      <div class="card"><h3>Nearby Hospitals</h3>
        ${DB.hospitals.slice(0,3).sort((a,b)=>a.dist-b.dist).map(h=>`<div class="list-item"><div><b>${h.name}</b><div class="muted">${h.dist} km ${h.emergency?'• 🚨 24h ER':''}</div></div><a class="btn ghost" href="#hospital/${h.id}">View</a></div>`).join('')}
        <button class="btn primary" style="width:100%;margin-top:10px" onclick="go('hospitals')">Search Hospitals</button>
      </div>
      <div class="card" style="margin-top:16px"><h3>Recent Medical Records</h3>
        ${DB.records.slice(0,2).map(r=>`<div class="list-item"><div><b>${r.name}</b><div class="muted">${r.type} • ${fmtDate(r.date)}</div></div></div>`).join('')}
        <a class="btn ghost" href="#records" style="display:inline-block;margin-top:8px">View all records</a>
      </div>
    </div>
  </div>`;
}
function apptCard(a){
  const h=DB.hospitals.find(x=>x.id===a.hospitalId);const doc=h.doctors.find(d=>d.id===a.doctorId);
  const statusPill=a.status==='Confirmed'?'ok':a.status==='Cancelled'?'bad':'warn';
  return `<div class="card">
   <div class="row" style="justify-content:space-between"><h3 style="margin:0">${h.name}</h3><span class="pill ${statusPill}">${a.status}</span></div>
   <div class="muted">${doc.name} • ${a.dept}</div>
   <div class="row" style="margin-top:10px;gap:22px">
     <div><label>Date</label>${fmtDate(a.date)}</div><div><label>Time</label>${a.time}</div>
     <div><label>Appointment ID</label>${a.id}</div><div><label>Address</label>${h.address}</div>
   </div>
   <div class="row" style="margin-top:14px">
     <a class="btn ghost" href="#hospital/${h.id}">View Hospital</a>
     <button class="btn primary" onclick="go('appointments')">Manage</button>
   </div></div>`;
}

/* ---------- HOSPITALS ---------- */
let hospState={mode:'normal',q:'',emergencyOnly:false,facility:''};
function pgHospitals(){
  const s=hospState;
  let list=DB.hospitals.filter(h=>h.name.toLowerCase().includes(s.q.toLowerCase()));
  if(s.mode==='emergency'){list=list.filter(h=>h.dist<=5&&h.emergency);}
  else if(s.emergencyOnly){list=list.filter(h=>h.emergency);}
  if(s.facility)list=list.filter(h=>h.facilities.includes(s.facility));
  list=list.slice().sort((a,b)=>a.dist-b.dist);
  const allFac=[...new Set(DB.hospitals.flatMap(h=>h.facilities))].sort();
  return `
  <div class="section-title"><h1>Find Hospitals</h1></div>
  <div class="card">
    <div class="row">
      <button class="btn ${s.mode==='normal'?'primary':'ghost'}" onclick="hospState.mode='normal';route()">Normal Search</button>
      <button class="btn ${s.mode==='emergency'?'danger':'ghost'}" onclick="hospState.mode='emergency';route()">🚨 Emergency (within 5 km)</button>
    </div>
    <div class="row" style="margin-top:12px">
      <div style="flex:2;min-width:180px"><input placeholder="Search hospital by name…" value="${s.q}" oninput="hospState.q=this.value;route()"></div>
      <div style="flex:1;min-width:160px"><select onchange="hospState.facility=this.value;route()">
        <option value="">All facilities</option>${allFac.map(f=>`<option ${s.facility===f?'selected':''}>${f}</option>`).join('')}</select></div>
      ${s.mode==='normal'?`<label style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" style="width:auto" ${s.emergencyOnly?'checked':''} onchange="hospState.emergencyOnly=this.checked;route()"> 24h Emergency only</label>`:''}
    </div>
  </div>
  <div class="section-title"><h3>${s.mode==='emergency'?'Emergency Hospitals Nearby':'Hospitals'} (${list.length})</h3></div>
  ${list.length===0?'<div class="card empty">No hospitals match your filters.</div>':list.map(h=>`
  <div class="card" style="margin-bottom:12px">
    <div class="row" style="justify-content:space-between">
      <div><h3 style="margin:0">${h.name}</h3><div class="muted">${h.address} • ⭐ ${h.rating} (${h.reviews})</div></div>
      <div style="text-align:right"><b>${h.dist} km</b><br>${h.emergency?'<span class="pill ok">🚨 ER 24h</span>':'<span class="pill warn">No ER</span>'}</div>
    </div>
    <div class="row" style="margin-top:10px">
      ${h.facilities.slice(0,4).map(f=>`<span class="tag">${f}</span>`).join('')}${h.facilities.length>4?`<span class="tag">+${h.facilities.length-4} more</span>`:''}
    </div>
    <div class="row" style="margin-top:12px">
      <a class="btn ghost" href="#hospital/${h.id}">View Details</a>
      <a class="btn primary" href="#book/${h.id}">Book Appointment</a>
      ${h.emergency?`<button class="btn danger" onclick="go('emergency');setTimeout(()=>selectAmbHospital('${h.id}'),0)">Request Ambulance</button>`:''}
    </div>
  </div>`).join('')}`;
}

function pgHospitalDetail(id){
  const h=DB.hospitals.find(x=>x.id===id);
  if(!h)return '<div class="card empty">Hospital not found.</div>';
  return `
  <a class="muted" href="#hospitals">← Back to Hospitals</a>
  <div class="section-title"><h1>${h.name}</h1></div>
  <div class="grid2">
    <div>
      <div class="card">
        <div class="row" style="gap:24px">
          <div><label>Distance</label>${h.dist} km</div><div><label>Rating</label>⭐ ${h.rating} (${h.reviews} reviews)</div>
          <div><label>Hours</label>${h.hours}</div><div><label>Emergency</label>${h.emergency?'<span class="pill ok">Available 24h</span>':'<span class="pill bad">Not available</span>'}</div>
        </div>
        <div style="margin-top:10px"><label>Address</label>${h.address}<br><label>Phone</label>${h.phone}</div>
        ${h.beds?`<div style="margin-top:6px"><label>Available Beds</label>${h.beds}</div>`:''}
      </div>
      <div class="section-title"><h3>Facilities</h3></div>
      <div class="grid3">${h.facilities.map(f=>`<div class="card" style="text-align:center;padding:14px 8px;font-size:13px">${f}</div>`).join('')}</div>
      <div class="section-title"><h3>Doctors</h3></div>
      <div class="card">${h.doctors.map(d=>`<div class="list-item"><div><b>${d.name}</b><div class="muted">${d.spec}</div></div><a class="btn ghost" href="#book/${h.id}">Book</a></div>`).join('')}</div>
    </div>
    <div>
      <div class="card"><h3>Departments</h3>${h.departments.map(d=>`<span class="tag" style="margin:3px">${d}</span>`).join('')}</div>
      <div class="card" style="margin-top:16px"><a class="btn primary" style="width:100%;display:block;text-align:center" href="#book/${h.id}">Book Appointment</a>
      ${h.emergency?`<button class="btn danger" style="width:100%;margin-top:10px" onclick="go('emergency');setTimeout(()=>selectAmbHospital('${h.id}'),0)">Request Ambulance</button>`:''}</div>
    </div>
  </div>`;
}

/* ---------- BOOKING ---------- */
let bookState={};
function pgBook(hid){
  const h=DB.hospitals.find(x=>x.id===hid);
  if(!h)return '<div class="card empty">Hospital not found.</div>';
  if(!bookState.hospitalId||bookState.hospitalId!==hid)bookState={hospitalId:hid,step:1};
  const s=bookState;
  const doctors=h.doctors.filter(d=>!s.dept||d.spec===s.dept);
  const slots=['09:00 AM','10:30 AM','11:15 AM','02:00 PM','03:30 PM','04:45 PM'];
  if(s.step<5){
  return `<div class="section-title"><h1>Book Appointment — ${h.name}</h1></div>
  <div class="card">
  <div class="stepper">${[1,2,3,4].map(n=>`<div class="step ${s.step>=n?'done':''}"></div>`).join('')}</div>

  ${s.step===2?`<h3>2. Select Doctor</h3>${doctors.map(d=>`<div class="list-item"><span>${d.name} <span class="muted">(${d.spec})</span></span><button class="btn ${s.doctorId===d.id?'primary':'ghost'}" onclick="bookState.doctorId='${d.id}';bookState.step=3;route()">Select</button></div>`).join('')}<button class="btn ghost" style="margin-top:10px" onclick="bookState.step=1;route()">Back</button>`:''}
  ${s.step===3?`<h3>3. Date &amp; Time</h3><label>Date</label><input type="date" min="${todayStr()}" value="${s.date||''}" onchange="bookState.date=this.value;route()">
  <label>Available Slots</label><div class="row">${slots.map(t=>`<button class="btn ${s.time===t?'primary':'ghost'}" onclick="bookState.time='${t}';route()">${t}</button>`).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="bookState.step=2;route()">Back</button><button class="btn primary" ${(!s.date||!s.time)?'disabled':''} onclick="bookState.step=4;route()">Continue</button></div>`:''}
  ${s.step===4?`<h3>4. Reason for Visit</h3><label>Reason</label><input id="reasonI" placeholder="e.g. Routine checkup, follow-up..." value="${s.reason||''}">
  <label>Optional Notes</label><textarea id="notesI" rows="3">${s.notes||''}</textarea>
  <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="bookState.step=3;route()">Back</button>

  </div>`;

  const apptId=s.confirmedId||uid('APT');
  return `<div class="section-title"><h1>Confirm Appointment</h1></div>
  <div class="card" style="max-width:520px">
    <div class="idrow" style="border-color:var(--line);color:var(--ink)"><span>Patient</span><b>${DB.patient.name}</b></div>
    <div class="idrow" style="border-color:var(--line);color:var(--ink)"><span>Hospital</span><b>${h.name}</b></div>
    <div class="idrow" style="border-color:var(--line);color:var(--ink)"><span>Doctor</span><b>${doc.name}</b></div>
    <div class="idrow" style="border-color:var(--line);color:var(--ink)"><span>Department</span><b>${s.dept}</b></div>
    <div class="idrow" style="border-color:var(--line);color:var(--ink)"><span>Date</span><b>${fmtDate(s.date)}</b></div>
    <div class="idrow" style="border-color:var(--line);color:var(--ink)"><span>Time</span><b>${s.time}</b></div>
    <div class="idrow" style="border-color:var(--line);color:var(--ink)"><span>Reason</span><b>${s.reason}</b></div>
    <div class="idrow" style="border-color:transparent;color:var(--ink)"><span>Appointment ID</span><b>${apptId}</b></div>
    <div class="row" style="margin-top:16px">
      ${s.confirmedId?`<button class="btn primary" onclick="go('appointments')">Go to Appointments</button>`:
      `<button class="btn ghost" onclick="bookState.step=4;route()">Back</button>
      <button class="btn primary" onclick="confirmBooking('${hid}')">Confirm Appointment</button>`}
    </div>
  </div>`;
}
function confirmBooking(hid){
  const s=bookState,h=DB.hospitals.find(x=>x.id===hid);
  const id=uid('APT');
  DB.appointments.push({id,hospitalId:hid,doctorId:s.doctorId,date:s.date,time:s.time,dept:s.dept,reason:s.reason,notes:s.notes,status:'Confirmed'});
  DB.reminders.push({id:uid('REM'),title:`Appointment: ${s.dept} at ${h.name}`,desc:s.reason,type:'Appointment',date:s.date,time:s.time,freq:'Once',active:true});
  save();bookState.confirmedId=id;toast('Appointment confirmed — ID '+id);route();
}

/* ---------- APPOINTMENTS (MANAGE) ---------- */
function pgAppointments(){
  const list=DB.appointments.slice().sort((a,b)=>a.date.localeCompare(b.date));
  return `<div class="section-title"><h1>Appointments</h1><a class="btn primary" href="#hospitals">+ Book New</a></div>
  ${list.length===0?`<div class="card empty">No upcoming appointments<br><br><button class="btn primary" onclick="go('hospitals')">Book an Appointment</button></div>`:
  list.map(a=>{
    const h=DB.hospitals.find(x=>x.id===a.hospitalId);const doc=h.doctors.find(d=>d.id===a.doctorId);
    const statusPill=a.status==='Confirmed'?'ok':a.status==='Cancelled'?'bad':'warn';
    return `<div class="card" style="margin-bottom:12px">
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">${h.name}</h3><span class="pill ${statusPill}">${a.status}</span></div>
    <div class="muted">${doc.name} • ${a.dept} • ID ${a.id}</div>
    <div class="row" style="margin-top:10px;gap:22px"><div><label>Date</label>${fmtDate(a.date)}</div><div><label>Time</label>${a.time}</div><div><label>Room/Dept</label>${a.dept} Wing</div></div>
    ${a.status!=='Cancelled'?`<div class="row" style="margin-top:12px">
      <a class="btn ghost" href="#hospital/${h.id}">Doctor/Hospital Info</a>
      <button class="btn ghost" onclick="openReschedule('${a.id}')">Reschedule</button>
      <button class="btn danger" onclick="cancelAppt('${a.id}')">Cancel</button>
    </div>`:''}
    </div>`;
  }).join('')}`;
}
function cancelAppt(id){
  confirmDialog('Cancel appointment?','This will cancel your appointment. This action cannot be undone.','Cancel Appointment',()=>{
    const a=DB.appointments.find(x=>x.id===id);a.status='Cancelled';save();toast('Appointment cancelled');route();
  });
}
function openReschedule(id){
  const a=DB.appointments.find(x=>x.id===id);
  modal(`<h3>Reschedule Appointment</h3><label>New Date</label><input type="date" id="rdate" min="${todayStr()}" value="${a.date}">
  <label>New Time</label><select id="rtime">${['09:00 AM','10:30 AM','11:15 AM','02:00 PM','03:30 PM','04:45 PM'].map(t=>`<option ${a.time===t?'selected':''}>${t}</option>`).join('')}</select>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
  <button class="btn primary" onclick="doReschedule('${id}')">Save Changes</button></div>`);
}
function doReschedule(id){
  const a=DB.appointments.find(x=>x.id===id);
  a.date=document.getElementById('rdate').value;a.time=document.getElementById('rtime').value;a.status='Confirmed';
  save();closeModal();toast('Appointment rescheduled');route();
}

/* ---------- MEDICAL RECORDS ---------- */
let recQ='';
function pgRecords(){
  const list=DB.records.filter(r=>r.name.toLowerCase().includes(recQ.toLowerCase())||r.type.toLowerCase().includes(recQ.toLowerCase()));
  return `<div class="section-title"><h1>Digital Medical Records</h1><button class="btn primary" onclick="openUpload()">+ Upload Report</button></div>
  <input placeholder="Search reports by name or type…" value="${recQ}" oninput="recQ=this.value;route()" style="margin-bottom:16px">
  ${list.length===0?'<div class="card empty">No reports found.</div>':list.map(r=>`
  <div class="card" style="margin-bottom:10px"><div class="list-item" style="border:none;padding:0">
    <div><b>${r.name}</b><div class="muted">${r.type} • ${fmtDate(r.date)} • ${r.hospital} • ${r.doctor}</div></div>
    <div class="row"><button class="btn ghost" onclick="viewRecord('${r.id}')">View</button>
    <button class="btn primary" onclick="go('ai/${r.id}')">AI Summary</button></div>
  </div></div>`).join('')}`;
}
function openUpload(){
  modal(`<h3>Upload Medical Report</h3>
  <label>Select File</label><input type="file" id="upFile" accept=".pdf,.jpg,.jpeg,.png,.webp">
  <div id="upFileName" class="muted" style="margin-top:4px"></div>
  <label>Report Name</label><input id="upN" placeholder="e.g. Blood Test Report">
  <label>Category</label><select id="upT">${['Blood Test','Urine Test','X-Ray','CT Scan','MRI','ECG','Prescription','Discharge Summary','Lab Report','Other'].map(t=>`<option>${t}</option>`).join('')}</select>
  <label>Hospital / Doctor</label><input id="upH" placeholder="Hospital name" style="margin-bottom:8px"><input id="upD" placeholder="Doctor name">
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
  <button class="btn primary" onclick="doUpload()">Upload</button></div>`);
  document.getElementById('upFile').addEventListener('change',function(){
    const f=this.files[0];document.getElementById('upFileName').textContent=f?f.name:'';
    if(f&&!document.getElementById('upN').value)document.getElementById('upN').value=f.name.replace(/\.[^.]+$/,'');
  });
}
function doUpload(){
  const name=document.getElementById('upN').value||'Untitled Report';
  const type=document.getElementById('upT').value,hospital=document.getElementById('upH').value||'—',doctor=document.getElementById('upD').value||'—';
  const file=document.getElementById('upFile').files[0];
  const finish=(fileData,fileType,fileName)=>{
    const rec={id:uid('REC'),name,type,date:todayStr(),hospital,doctor,fileData,fileType,fileName};
    DB.records.unshift(rec);save();closeModal();toast('Report uploaded');
    location.hash='ai/'+rec.id;
  };
  if(file){
    const reader=new FileReader();
    reader.onload=()=>finish(reader.result,file.type,file.name);
    reader.onerror=()=>{finish(null,null,null);};
    reader.readAsDataURL(file);
  }else{finish(null,null,null);}
}
function viewRecord(id){
  const r=DB.records.find(x=>x.id===id);
  if(!r||!r.fileData){modal(`<h3>${r?r.name:'Report'}</h3><p class="muted">No file was attached to this report.</p><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" onclick="closeModal()">Close</button></div>`);return;}
  let body='';
  if(r.fileType&&r.fileType.startsWith('image/'))body=`<img src="${r.fileData}" style="width:100%;border-radius:8px">`;
  else if(r.fileType==='application/pdf')body=`<embed src="${r.fileData}" type="application/pdf" width="100%" height="440" style="border-radius:8px">`;
  else body=`<p class="muted">Preview not available for this file type.</p>`;
  modal(`<h3>${r.name}</h3>${body}<div class="row" style="justify-content:flex-end;margin-top:14px">
  <a class="btn ghost" href="${r.fileData}" download="${r.fileName||'report'}">Download</a>
  <button class="btn primary" onclick="closeModal()">Close</button></div>`);
}

SUMMARY_I18N.Other=SUMMARY_I18N.English;
function aiSummary(rec,lang){
  const t=SUMMARY_I18N[lang]||SUMMARY_I18N.English;
  const fallbackNote=SUMMARY_I18N[lang]?'':'<p class="muted">This language isn\'t fully supported in the prototype yet — showing English.</p>';
  return `<div class="card" style="margin-top:16px">
  <div class="row" style="justify-content:space-between"><h3>${t.tag} — ${lang}</h3><button class="btn ghost" onclick="aiState.lang=null;route()">${t.change}</button></div>
  ${fallbackNote}
  <h4>${t.hOverview}</h4><p>${t.overview}</p>
  <h4>${t.hKey}</h4><p>${t.key}</p>
  <h4>${t.hNormal}</h4><p>${t.normal}</p>
  <h4>${t.hAbnormal}</h4><p><span class="pill warn">${t.flagged}</span> ${t.abnormal}</p>
  <h4>${t.hMeaning}</h4><p>${t.meaning}</p>
  <h4>${t.hQ}</h4>
  <ul>${t.q.map(x=>`<li>${x}</li>`).join('')}</ul>
  <div class="card" style="background:var(--mint);border-color:var(--teal);margin-top:14px"><b>${t.notice}</b> ${t.notice2}</div>
  </div>`;
}

/* ---------- REMINDERS ---------- */
function pgReminders(){
  const list=DB.reminders.slice().sort((a,b)=>a.date.localeCompare(b.date));
  return `<div class="section-title"><h1>Health Reminders</h1><button class="btn primary" onclick="openReminderForm()">+ New Reminder</button></div>
  ${list.length===0?'<div class="card empty">No reminders yet.</div>':list.map(r=>`
  <div class="card" style="margin-bottom:10px"><div class="list-item" style="border:none;padding:0">
   <div><b>${r.title}</b><div class="muted">${r.desc||''}</div><div class="muted">${fmtDate(r.date)} • ${r.time} • ${r.freq} • ${r.type}</div></div>
   <div class="row">
    <label style="display:flex;align-items:center;gap:6px;margin:0"><input type="checkbox" style="width:auto" ${r.active?'checked':''} onchange="toggleReminder('${r.id}')"> Active</label>
    <button class="btn ghost" onclick="openReminderForm('${r.id}')">Edit</button>
    <button class="btn danger" onclick="deleteReminder('${r.id}')">Delete</button>
   </div></div></div>`).join('')}`;
}
function toggleReminder(id){const r=DB.reminders.find(x=>x.id===id);r.active=!r.active;save();route();}
function deleteReminder(id){confirmDialog('Delete reminder?','This reminder will be removed permanently.','Delete',()=>{DB.reminders=DB.reminders.filter(x=>x.id!==id);save();route();});}
function openReminderForm(id){
  const r=DB.reminders.find(x=>x.id===id)||{};
  modal(`<h3>${id?'Edit':'New'} Reminder</h3>
  <label>Title</label><input id="rmT" value="${r.title||''}" placeholder="e.g. Take medicine">
  <label>Description</label><input id="rmDsc" value="${r.desc||''}">
  <label>Type</label><select id="rmTy">${['Medicine','Appointment','Test','Follow-up','Vaccination','Checkup','Water Intake','Other'].map(t=>`<option ${r.type===t?'selected':''}>${t}</option>`).join('')}</select>
  <div class="row"><div style="flex:1"><label>Date</label><input type="date" id="rmD" value="${r.date||todayStr()}"></div><div style="flex:1"><label>Time</label><input type="time" id="rmTi" value="${r.time?to24(r.time):'08:00'}"></div></div>
  <label>Frequency</label><select id="rmF">${['Once','Daily','Weekly','Monthly'].map(f=>`<option ${r.freq===f?'selected':''}>${f}</option>`).join('')}</select>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
  <button class="btn primary" onclick="saveReminder('${id||''}')">Save Reminder</button></div>`);
}
function to24(t){const [time,ap]=t.split(' ');let[h,m]=time.split(':').map(Number);if(ap==='PM'&&h!==12)h+=12;if(ap==='AM'&&h===12)h=0;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
function saveReminder(id){
  const [h,m]=document.getElementById('rmTi').value.split(':').map(Number);
  const time=(h%12||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM');
  const data={title:document.getElementById('rmT').value||'Reminder',desc:document.getElementById('rmDsc').value,
   type:document.getElementById('rmTy').value,date:document.getElementById('rmD').value,time,freq:document.getElementById('rmF').value,active:true};
  if(id){Object.assign(DB.reminders.find(x=>x.id===id),data);}else{DB.reminders.push({id:uid('REM'),...data});}
  save();closeModal();toast('Reminder saved');route();
}

function pgEmergency(){
  const amb=DB.ambulance;
  const emgHospitals=DB.hospitals.filter(h=>h.emergency).sort((a,b)=>a.dist-b.dist);
  if(!amb||amb.step==='select'){
    const h=amb?DB.hospitals.find(x=>x.id===amb.hospitalId):null;
    return `<div class="section-title"><h1 style="color:var(--red)">🚨 Emergency</h1></div>
    <div class="card" style="border-color:var(--red);background:#FEF4F3">In a life-threatening emergency, call your local emergency number immediately. This feature simulates hospital-side ambulance dispatch.</div>
    <div class="section-title"><h3>Select a Hospital</h3></div>
    ${emgHospitals.map(x=>`<div class="card" style="margin-bottom:10px"><div class="list-item" style="border:none;padding:0">
     <div><b>${x.name}</b><div class="muted">${x.dist} km • ${x.address}</div></div>
     <button class="btn ${h&&h.id===x.id?'primary':'ghost'}" onclick="selectAmbHospital('${x.id}')">${h&&h.id===x.id?'Selected':'Select'}</button>
    </div></div>`).join('')}
    ${h?`<div class="card"><h3>Request Ambulance</h3>
     <div class="row" style="gap:22px"><div><label>Hospital</label>${h.name}</div><div><label>Distance</label>${h.dist} km</div><div><label>Emergency Dept</label>Available 24h</div></div>
     <div class="row" style="gap:22px;margin-top:6px"><div><label>Pickup Location</label>Current location (GPS)</div><div><label>Destination</label>${h.name}</div><div><label>Emergency Contact</label>${DB.patient.emergencyContact}</div></div>
     <button class="btn emergency" style="margin-top:14px" onclick="confirmAmbulance()">Request Ambulance</button></div>`:''}`;
  }
  const h=DB.hospitals.find(x=>x.id===amb.hospitalId);
  const stages=['Requested','Driver Assigned','En Route','Arrived','Picked Up','At Hospital'];
  const idx=amb.stageIdx||0;
  return `<div class="section-title"><h1 style="color:var(--red)">Ambulance Status</h1></div>
  <div class="card">
   <div class="row" style="gap:22px"><div><label>Hospital</label>${h.name}</div><div><label>ETA</label>${Math.max(1,8-idx*2)} min</div><div><label>Emergency #</label>${h.phone}</div></div>
   <div class="progress-track">${stages.map((s,i)=>`<div class="pnode"><div class="pdot ${i<=idx?'on':''}">${i<=idx?'✓':''}</div>${s}</div>`).join('')}</div>
   <div class="row">
    ${idx<stages.length-1?`<button class="btn primary" onclick="advanceAmbulance()">Simulate Next Update</button>`:`<button class="btn primary" onclick="finishAmbulance('${h.id}')">Proceed to Admission</button>`}
    <button class="btn ghost" onclick="DB.ambulance=null;save();route()">Reset</button>
   </div>
  </div>`;
}
function confirmAmbulance(){
  confirmDialog('Confirm ambulance request?','An ambulance will be dispatched to your location for transport to '+DB.hospitals.find(x=>x.id===DB.ambulance.hospitalId).name+'.','Request Ambulance',()=>{
    DB.ambulance.step='track';DB.ambulance.stageIdx=0;save();toast('Ambulance requested');route();
  });
}
function advanceAmbulance(){DB.ambulance.stageIdx=(DB.ambulance.stageIdx||0)+1;save();route();}
function finishAmbulance(hid){location.hash='admission/'+hid;}

/* ---------- ADMISSION ---------- */
function pgAdmission(hid){
  const h=DB.hospitals.find(x=>x.id===hid)||DB.hospitals[0];
  const existing=DB.admissions.find(a=>a.hospitalId===h.id&&a.recent);
  return `<div class="section-title"><h1>Patient Admission ID</h1></div>
  <div class="grid2">
  <div class="card">
   <h3>Admission Details</h3>
   <label>Hospital</label><select id="adH">${DB.hospitals.map(x=>`<option value="${x.id}" ${x.id===h.id?'selected':''}>${x.name}</option>`).join('')}</select>
   <label>Reason for Admission</label><input id="adR" placeholder="e.g. Chest pain / Cardiology consultation">
   <div class="row"><div style="flex:1"><label>Doctor</label><input id="adDoc" placeholder="Dr. name"></div><div style="flex:1"><label>Department</label><input id="adDept" placeholder="Department"></div></div>
   <div class="row"><div style="flex:1"><label>Room No</label><input id="adRoom" placeholder="e.g. 304"></div><div style="flex:1"><label>Floor</label><input id="adFloor" placeholder="e.g. 3rd Floor"></div></div>
   <label>Admission Type</label><select id="adType"><option>Normal</option><option>Emergency</option></select>
   <button class="btn primary" style="margin-top:14px" onclick="generateAdmission()">Generate Admission ID</button>
  </div>
  <div id="idcard-holder">${existing?renderIdCard(existing):'<div class="card empty">Fill the form and generate a Patient Admission ID card.</div>'}</div>
  </div>`;
}
function generateAdmission(){
  const h=DB.hospitals.find(x=>x.id===document.getElementById('adH').value);
  const a={id:'HSP-2026-'+Math.floor(10000+Math.random()*89999),hospitalId:h.id,hospitalName:h.name,patientName:DB.patient.name,age:DB.patient.age,
   reason:document.getElementById('adR').value||'General Checkup',doctor:document.getElementById('adDoc').value||'Duty Doctor',
   department:document.getElementById('adDept').value||'General Medicine',roomNumber:document.getElementById('adRoom').value||'—',
   floor:document.getElementById('adFloor').value||'—',contactNumber:DB.patient.phone,admissionDate:todayStr(),admissionType:document.getElementById('adType').value,recent:true};
  DB.admissions.forEach(x=>x.recent=false);DB.admissions.push(a);save();
  document.getElementById('idcard-holder').innerHTML=renderIdCard(a);
  toast('Admission ID generated');
}
function renderIdCard(a){
  return `<div class="idcard">
   <div class="hname">${a.hospitalName.toUpperCase()}<br><span style="font-size:12px;font-weight:400">PATIENT ADMISSION CARD</span></div>
   <div class="idrow"><span>Patient ID</span><b>${a.id}</b></div>
   <div class="idrow"><span>Name</span><b>${a.patientName}</b></div>
   <div class="idrow"><span>Age</span><b>${a.age}</b></div>
   <div class="idrow"><span>Reason</span><b>${a.reason}</b></div>
   <div class="idrow"><span>Doctor</span><b>${a.doctor}</b></div>
   <div class="idrow"><span>Department</span><b>${a.department}</b></div>
   <div class="idrow"><span>Room No</span><b>${a.roomNumber}</b></div>
   <div class="idrow"><span>Floor</span><b>${a.floor}</b></div>
   <div class="idrow"><span>Contact</span><b>${a.contactNumber}</b></div>
   <div class="idrow"><span>Admission Type</span><b>${a.admissionType}</b></div>
   <div class="idrow" style="border:none"><span>Admission Date</span><b>${fmtDate(a.admissionDate)}</b></div>
  </div>`;
}

/* ---------- PROFILE ---------- */
function pgProfile(){
  const p=DB.patient;
  return `<div class="section-title"><h1>Profile</h1></div>
  <div class="card" style="max-width:520px">
   <div class="row" style="align-items:center"><div class="avatar" style="width:70px;height:70px;font-size:26px">${p.name.split(' ').map(n=>n[0]).join('')}</div>
   <div><h3 style="margin:0">${p.name}</h3><div class="muted">Patient ID: ${p.id}</div></div></div>
   <label>Full Name</label><input id="pfN" value="${p.name}">
   <div class="row"><div style="flex:1"><label>Age</label><input id="pfA" type="number" value="${p.age}"></div><div style="flex:1"><label>Blood Group</label><input id="pfB" value="${p.blood}"></div></div>
   <label>Phone</label><input id="pfP" value="${p.phone}">
   <label>Email</label><input id="pfE" value="${p.email}">
   <label>Emergency Contact</label><input id="pfEC" value="${p.emergencyContact}">
   <label>Known Conditions</label><input id="pfC" value="${p.conditions}">
   <button class="btn primary" style="margin-top:14px" onclick="saveProfile()">Save Changes</button>
  </div>`;
}
function saveProfile(){
  Object.assign(DB.patient,{name:document.getElementById('pfN').value,age:+document.getElementById('pfA').value,
   blood:document.getElementById('pfB').value,phone:document.getElementById('pfP').value,email:document.getElementById('pfE').value,
   emergencyContact:document.getElementById('pfEC').value,conditions:document.getElementById('pfC').value});
  save();toast('Profile updated');route();
}
</script>
